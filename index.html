<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mary Rose Reception Screen</title>
<style>
/* EB Garamond and Open Sans (SIL Open Font Licence), served from the fonts folder */
@font-face{font-family:"EB Garamond";font-weight:400;font-style:normal;font-display:block;src:url("fonts/eb-garamond-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:400;font-style:italic;font-display:block;src:url("fonts/eb-garamond-latin-400-italic.woff2") format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:600;font-style:italic;font-display:block;src:url("fonts/eb-garamond-latin-600-italic.woff2") format("woff2")}
@font-face{font-family:"Open Sans";font-weight:400;font-style:normal;font-display:block;src:url("fonts/open-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Open Sans";font-weight:600;font-style:normal;font-display:block;src:url("fonts/open-sans-latin-600-normal.woff2") format("woff2")}


/* Layout: one 1080 x 1920 portrait stage scaled to fit the display. The top 1536px is a deck of
   dark, picture-led screens that push sideways on a timer: big Garamond titles, a few lines of
   text, photographs behind. The bottom 384px is a footer that never moves. */
:root {
  /* Colour system, from "Type and colour design system v2" */
  --red: #D90C00;
  --purple: #402654;
  --maroon: #57263A;
  --gold: #BD9B37;
  --mist: #EDECF5;
  --paper: #FDFBFF;
  --teal: #007298;
  --navy: #162664;
  --ink: #020018;
  --hair: rgba(253, 251, 255, .3);

  /* Type system: Garamond for titles and names (32px and up), Open Sans for text and caps labels.
     Adobe Garamond Pro is used when the player has it installed; EB Garamond is the bundled stand-in. */
  --display: "Adobe Garamond Pro", "adobe-garamond-pro", "EB Garamond", Garamond, Georgia, serif;
  --text: "Open Sans", "Helvetica Neue", Arial, sans-serif;

  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--text);
  overflow: hidden;
}
#viewport {
  position: fixed;
  left: 0; top: 0; right: 0; bottom: 0;
  overflow: hidden;
  background: var(--ink);
  cursor: none;
}
#stage {
  position: absolute;
  left: 50%; top: 50%;
  width: 1080px; height: 1920px;
  margin: -960px 0 0 -540px;
  overflow: hidden;
  background: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#deck {
  position: absolute;
  left: 0; top: 0;
  width: 1080px; height: 1536px;
  overflow: hidden;
  background: var(--ink);
}

/* ---------- Screens and the carousel ---------- */
.screen {
  position: absolute;
  left: 0; top: 0;
  width: 1080px; height: 1536px;
  box-sizing: border-box;
  background: var(--tone);
  color: var(--paper);
  visibility: hidden;
  transform: translateX(100%);
  overflow: hidden;
}
.screen.is-on { visibility: visible; transform: none; }
.screen.is-in { animation: push-in 1.15s cubic-bezier(.72, 0, .18, 1) both; }
.screen.is-out { visibility: visible; animation: push-out 1.15s cubic-bezier(.72, 0, .18, 1) both; }
.screen.is-in.rev { animation-name: push-in-rev; }
.screen.is-out.rev { animation-name: push-out-rev; }
@keyframes push-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes push-out { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@keyframes push-in-rev { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes push-out-rev { from { transform: translateX(0); } to { transform: translateX(100%); } }

.screen.is-in .rise { animation: rise .75s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* Section colours. --tone is the ground, --accent the highlight used on it. */
.t-ink    { --tone: var(--ink);    --accent: var(--gold); }
.t-navy   { --tone: var(--navy);   --accent: var(--gold); }
.t-purple { --tone: var(--purple); --accent: var(--gold); }
.t-maroon { --tone: var(--maroon); --accent: var(--gold); }
.t-teal   { --tone: var(--teal);   --accent: var(--paper); }

/* ---------- Shared furniture ---------- */
.mast {
  position: relative;
  height: 118px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--hair);
}
.logo { display: block; height: 100px; width: auto; }
.label {
  font: 600 20px/1 var(--text);
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: .9;
}
.label b { font-weight: 600; margin-left: 16px; opacity: .7; }
.eyebrow {
  font: 600 24px/1.3 var(--text);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}
.title {
  font: 400 92px/1.03 var(--display);
  letter-spacing: -.012em;
  margin: 16px 0 0;
}
.title em, .sub em { font-style: italic; font-weight: 600; white-space: nowrap; }
.sub { font: 400 42px/1.16 var(--display); margin: 14px 0 0; }

/* ---------- Picture screens ---------- */
.feature { background: var(--ink); padding: 0 72px; }
.bg {
  position: absolute;
  left: -2px; top: -2px;
  width: 1084px; height: 1540px;
  background-size: cover;
  background-position: 50% 50%;
}
.scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 1536px; }
.at-top .scrim {
  background: linear-gradient(180deg, rgba(2, 0, 24, .88) 0%, rgba(2, 0, 24, .8) 46%, rgba(2, 0, 24, .14) 74%, rgba(2, 0, 24, .4) 100%);
}
.at-bottom .scrim {
  background: linear-gradient(180deg, rgba(2, 0, 24, .78) 0%, rgba(2, 0, 24, .12) 15%, rgba(2, 0, 24, .04) 36%, rgba(2, 0, 24, .8) 62%, rgba(2, 0, 24, .93) 100%);
}
.at-both .scrim {
  background: linear-gradient(180deg, rgba(2, 0, 24, .9) 0%, rgba(2, 0, 24, .8) 40%, rgba(2, 0, 24, .1) 60%, rgba(2, 0, 24, .1) 70%, rgba(2, 0, 24, .9) 88%, rgba(2, 0, 24, .95) 100%);
}
.band .scrim {
  background: linear-gradient(180deg, rgba(2, 0, 24, .9) 0%, rgba(2, 0, 24, .64) 12%, rgba(2, 0, 24, .1) 27%, rgba(2, 0, 24, .1) 52%, rgba(2, 0, 24, 1) 88%, rgba(2, 0, 24, 1) 100%);
}
/* colour-washed stand-in pictures are already dark, so they take a lighter veil */
.wash.at-top .scrim {
  background: linear-gradient(180deg, rgba(2, 0, 24, .66) 0%, rgba(2, 0, 24, .52) 48%, rgba(2, 0, 24, 0) 78%, rgba(2, 0, 24, .25) 100%);
}
.wash.at-bottom .scrim {
  background: linear-gradient(180deg, rgba(2, 0, 24, .5) 0%, rgba(2, 0, 24, 0) 15%, rgba(2, 0, 24, 0) 38%, rgba(2, 0, 24, .58) 62%, rgba(2, 0, 24, .8) 100%);
}
.main { position: absolute; left: 72px; right: 72px; }
.at-top .main, .at-both .main { top: 164px; }
.at-bottom .main { bottom: 76px; }

.tag {
  display: inline-block;
  background: var(--red);
  color: var(--paper);
  font: 600 24px/1 var(--text);
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 16px 22px 15px;
}
.big {
  font: italic 600 270px/1 var(--display);
  color: var(--gold);
  letter-spacing: -.02em;
  margin: 26px 0 0 -8px;
  white-space: nowrap;
  font-variant-numeric: lining-nums;
}
.feature .title { font-size: 108px; line-height: 1.02; margin-top: 34px; }
.feature .big + .title { margin-top: 36px; }
.feature .eyebrow + .title { margin-top: 22px; }
.lede { font: 400 38px/1.45 var(--text); margin: 34px 0 0; max-width: 880px; }
.lede.loud { font-size: 42px; line-height: 1.4; max-width: 800px; }
.note { font: 400 28px/1.45 var(--text); margin: 24px 0 0; max-width: 860px; opacity: .9; }

.facts { margin-top: 44px; border-bottom: 2px solid var(--hair); }
.fact-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 2px solid var(--hair);
  padding: 22px 0 25px;
}
.fact-row .k { font: 400 56px/1.1 var(--display); }
.fact-row .d { font: 400 29px/1.2 var(--text); white-space: nowrap; }

.dates-row { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; border-top: 2px solid var(--hair); padding-top: 24px; }
.dates-row > div { width: 312px; }
.dates-row .y { font: 400 108px/1 var(--display); color: var(--gold); letter-spacing: -.01em; font-variant-numeric: lining-nums; }
.dates-row b {
  display: block;
  font: 600 21px/1.3 var(--text);
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-top: 12px;
}
.dates-row span { display: block; font: 400 25px/1.35 var(--text); margin-top: 4px; opacity: .9; }

/* ---------- Supporter lists ---------- */
.head {
  position: relative;
  padding: 0 72px 30px;
  background-size: cover;
  background-position: 50% 30%;
}
.head .mast { margin-bottom: 40px; }
.body { position: relative; padding: 4px 72px 0; }
.body .lede { font-size: 30px; line-height: 1.5; margin-top: 34px; text-wrap: balance; }

.tier { margin-top: 44px; }
.tier::before {
  content: "";
  display: block;
  width: 150px; height: 6px;
  background: var(--accent);
  margin-bottom: 22px;
}
.tier .n { font-family: var(--display); line-height: 1.1; margin-top: 17px; }
.tier .n:first-child { margin-top: 0; }
.tier.large .n { letter-spacing: -.012em; }

.officers { margin-top: 46px; font: 400 50px/1.15 var(--display); }
.founder { margin-top: 36px; }
.founder .n { font: 400 56px/1.12 var(--display); margin-top: 12px; }

.rank { margin-top: 40px; }
.rank-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 13px;
  border-bottom: 2px solid var(--hair);
  font: 600 24px/1.2 var(--text);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
}
.rank-head span { letter-spacing: .12em; opacity: .8; }
.names { margin-top: 12px; font-family: var(--display); font-size: 38px; line-height: 1.15; }
.names .n { display: block; white-space: nowrap; padding: 9px 0; break-inside: avoid; }
.names.two { column-count: 2; column-gap: 40px; }
.pn {
  font: 600 .56em/1 var(--text);
  letter-spacing: .1em;
  margin-left: .38em;
  opacity: .78;
  white-space: nowrap;
}
.side { display: flex; margin-top: 2px; }
.side > div { width: 448px; }
.side > div + div { margin-left: 40px; }
.side .rank { margin-top: 30px; }
.side .names .n { padding: 7px 0; }
.closing { font: italic 400 40px/1.25 var(--display); margin: 38px 0 0; max-width: 840px; }

.lottery {
  position: absolute;
  left: 72px; bottom: 44px;
  width: 470px; height: auto;
  mix-blend-mode: screen;
}

/* One screen carries more lines than the rest and is set a little tighter */
.compact .tier { margin-top: 32px; }
.compact .tier::before { margin-bottom: 17px; }
.compact .tier .n { margin-top: 12px; }
.compact .officers { margin-top: 28px; font-size: 44px; }
.compact .side .rank { margin-top: 22px; }
.compact .side .names .n { padding: 4px 0; }
.compact .closing { margin-top: 28px; font-size: 38px; }
/* And one carries very few, so it is opened up */
.airy .tier { margin-top: 64px; }

/* ---------- Footer: always on screen ---------- */
#foot {
  position: absolute;
  left: 0; bottom: 0;
  width: 1080px; height: 384px;
  box-sizing: border-box;
  background: var(--ink);
  color: var(--paper);
  --accent: var(--gold);
}
.progress { height: 6px; background: rgba(253, 251, 255, .16); }
.progress i {
  display: block;
  height: 100%;
  background: var(--gold);
  transform-origin: 0 50%;
  transform: scaleX(0);
}
.progress i.run { animation: fill 10s linear both; }
.paused .progress i { animation-play-state: paused; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.foot-main { display: flex; align-items: stretch; height: 268px; padding: 26px 72px 24px; }
.qr { width: 268px; height: 268px; background: var(--paper); flex: none; }
.qr svg { display: block; width: 100%; height: 100%; }
.qr path { fill: var(--ink); }
.foot-text { margin-left: 36px; width: 632px; display: flex; flex-direction: column; justify-content: space-between; }
.foot-top { display: flex; justify-content: space-between; align-items: baseline; }
#foot .eyebrow { font-size: 21px; letter-spacing: .16em; }
.foot-top .url { font: 600 22px/1.3 var(--text); letter-spacing: .02em; }
.ask { font: 400 64px/1.02 var(--display); margin-top: 6px; white-space: nowrap; }
.ask em { font-style: italic; font-weight: 600; }
.give p { font: 400 24px/1.35 var(--text); margin: 8px 0 0; }
.hours { display: flex; border-top: 2px solid var(--hair); padding-top: 16px; }
.hour + .hour { margin-left: 26px; }
#foot .hour .eyebrow { font-size: 19px; letter-spacing: .14em; white-space: nowrap; }
.hour .v { font: 400 40px/1.1 var(--display); margin-top: 4px; white-space: nowrap; font-variant-numeric: lining-nums; }
.hour.now .v { color: var(--gold); }
.foot-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 58px;
  margin: 0 72px;
  border-top: 2px solid var(--hair);
  font: 400 23px/1.2 var(--text);
}
.credit { display: flex; align-items: center; font-size: 19px; opacity: .72; }
.credit img { display: block; height: 40px; width: auto; margin-left: 14px; }

@media (prefers-reduced-motion: reduce) {
  .screen.is-in, .screen.is-in.rev { animation: fade-in .6s linear both; }
  .screen.is-out, .screen.is-out.rev { animation: fade-out .6s linear both; }
  .screen.is-in .rise { animation: none; }
  @keyframes fade-in { from { opacity: 0; transform: none; } to { opacity: 1; transform: none; } }
  @keyframes fade-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: none; } }
}
.content-problem {
  position: fixed; left: 0; right: 0; top: 0; z-index: 10;
  padding: 20px 28px; background: #b3261e; color: #fff;
  font: 600 22px/1.4 "Open Sans", Arial, sans-serif;
}
.content-problem.fatal { top: 40%; margin: 0 40px; border-radius: 6px; font-size: 26px; }
</style>
</head>
<body>

<div id="viewport"><div id="stage"><div id="deck"></div><div id="foot"></div></div></div>

<script src="js/qrcode.js"></script>
<script>
/* ==========================================================================
   CONTENT lives in content.json, next to this file. Edit that file and upload it
   to change the wording, names, opening hours, pictures or timings. Nothing in
   this file needs changing for everyday updates. README.txt explains each part.
   ========================================================================== */
var CONTENT_URL = 'content.json';
var CACHE_KEY = 'maryRoseScreenContent';

/* ==========================================================================
   PLAYER. Builds the screens and footer and runs the carousel.
   Written in plain ES5 so it runs on older signage browsers.
   ========================================================================== */
function startScreen(C) {
  var FOOTER, SCREENS, IMAGES, LOGOS, SETTINGS, HOURS;
  function use(c) {
    FOOTER = c.footer; SCREENS = c.screens; IMAGES = c.images || {}; LOGOS = c.logos || {};
    SETTINGS = c.settings || {}; HOURS = c.openingHours || {};
  }
  use(C);
  var STAGE_W = 1080, STAGE_H = 1920, PUSH_MS = 1200;
  var POSTNOMINALS = /((?:\s(?:DL|OBE|MBE|CBE|GBE|DBE|KBE|CB|RN))+)$/;
  var TONE_RGB = { ink: '2,0,24', navy: '22,38,100', purple: '64,38,84', maroon: '87,38,58', teal: '0,114,152' };

  var stage = document.getElementById('stage');
  var deck = document.getElementById('deck');
  var foot = document.getElementById('foot');
  var viewport = document.getElementById('viewport');
  var els = [], current = 0, timer = null, paused = false, busy = false, bar = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function rich(s) { return esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>'); }
  function person(s) {
    var m = POSTNOMINALS.exec(s);
    if (!m) { return esc(s); }
    return esc(s.slice(0, m.index)) + '<span class="pn">' + esc(m[1].replace(/^\s+/, '')) + '</span>';
  }

  function mast(sc) {
    return '<div class="mast"><img class="logo" alt="The Mary Rose" src="' + LOGOS.maryRose + '">' +
      '<div class="label">' + esc(sc.label || '') + (sc.page ? '<b>' + esc(sc.page) + '</b>' : '') + '</div></div>';
  }
  function titles(sc) {
    var h = '';
    if (sc.eyebrow) { h += '<p class="eyebrow rise">' + esc(sc.eyebrow) + '</p>'; }
    if (sc.title) { h += '<h1 class="title rise"' + (sc.titleSize ? ' style="font-size:' + sc.titleSize + 'px"' : '') + '>' + rich(sc.title) + '</h1>'; }
    if (sc.sub) { h += '<p class="sub rise">' + rich(sc.sub).replace(/\n/g, '<br>') + '</p>'; }
    return h;
  }
  function rankBlock(r, cls) {
    var h = '<div class="rank"><div class="rank-head rise"><div>' + esc(r.rank) + '</div>' +
      (r.range ? '<span>' + esc(r.range) + '</span>' : '') + '</div><div class="names ' + cls + '"' +
      (r.size ? ' style="font-size:' + r.size + 'px"' : '') + '>';
    var pad = r.pad ? ' style="padding:' + r.pad + 'px 0"' : '';
    for (var i = 0; i < r.names.length; i++) { h += '<span class="n rise"' + pad + '>' + person(r.names[i]) + '</span>'; }
    return h + '</div></div>';
  }

  function buildList(sc) {
    var h = '', i, j;
    if (sc.lede) { h += '<p class="lede rise">' + esc(sc.lede) + '</p>'; }
    if (sc.founder) {
      h += '<div class="founder"><p class="eyebrow rise">' + esc(sc.founder.head) + '</p>' +
        '<div class="n rise">' + esc(sc.founder.name) + '</div></div>';
    }
    if (sc.tiers) {
      for (i = 0; i < sc.tiers.length; i++) {
        h += '<div class="tier' + (sc.tiers[i].size >= 70 ? ' large' : '') + '" style="font-size:' + sc.tiers[i].size + 'px">';
        for (j = 0; j < sc.tiers[i].names.length; j++) { h += '<div class="n rise">' + esc(sc.tiers[i].names[j]) + '</div>'; }
        h += '</div>';
      }
    }
    if (sc.ranks) {
      for (i = 0; i < sc.ranks.length; i++) { h += rankBlock(sc.ranks[i], 'two'); }
    }
    if (sc.officers) { h += '<div class="officers rise">' + esc(sc.officers) + '</div>'; }
    if (sc.side) {
      h += '<div class="side">';
      for (i = 0; i < sc.side.length; i++) {
        h += '<div>';
        for (j = 0; j < sc.side[i].length; j++) { h += rankBlock(sc.side[i][j], ''); }
        h += '</div>';
      }
      h += '</div>';
    }
    if (sc.closing) { h += '<p class="closing rise">' + esc(sc.closing) + '</p>'; }
    /* the title sits on a colour-washed picture that fades into the section colour */
    var rgb = TONE_RGB[sc.theme], band = IMAGES['band-' + sc.theme];
    var wash = 'linear-gradient(to bottom, rgba(' + rgb + ',.5) 0%, rgba(' + rgb + ',.62) 55%, rgb(' + rgb + ') 100%)';
    h = '<div class="head" style="background-image:' + wash + (band ? ',url(' + band + ')' : '') + '">' +
      mast(sc) + titles(sc) + '</div><div class="body">' + h + '</div>';
    if (sc.lottery) {
      h += '<img class="lottery rise" alt="Supported by The National Lottery through the Heritage Lottery Fund" src="' + LOGOS.lottery + '">';
    }
    return h;
  }

  function buildFeature(sc) {
    var band = sc.text === 'band' ? (sc.band || 700) : 0, i;
    var h = '<div class="bg" style="' + (IMAGES[sc.image] ? 'background-image:url(' + IMAGES[sc.image] + ');' : '') +
      (band ? 'height:' + (band + 2) + 'px' : '') + '"></div>' +
      '<div class="scrim"' + (band ? ' style="height:' + (band + 70) + 'px"' : '') + '></div>' + mast(sc) +
      '<div class="main"' + (band ? ' style="top:' + (band - 140) + 'px"' : '') + '>';
    if (sc.tag) { h += '<div class="tag rise">' + esc(sc.tag) + '</div>'; }
    if (sc.big) { h += '<div class="big rise">' + esc(sc.big) + '</div>'; }
    h += titles(sc);
    if (sc.lede) { h += '<p class="lede rise' + (sc.loud ? ' loud' : '') + '">' + esc(sc.lede) + '</p>'; }
    if (sc.facts) {
      h += '<div class="facts">';
      for (i = 0; i < sc.facts.length; i++) {
        h += '<div class="fact-row rise"><div class="k">' + esc(sc.facts[i].k) + '</div><div class="d">' + esc(sc.facts[i].d) + '</div></div>';
      }
      h += '</div>';
    }
    if (sc.note) { h += '<p class="note rise">' + esc(sc.note) + '</p>'; }
    h += '</div>';
    if (sc.dates) {
      h += '<div class="dates-row">';
      for (i = 0; i < sc.dates.length; i++) {
        h += '<div class="rise"><div class="y">' + esc(sc.dates[i].year) + '</div><b>' + esc(sc.dates[i].head) + '</b><span>' + esc(sc.dates[i].text) + '</span></div>';
      }
      h += '</div>';
    }
    return h;
  }

  function footerHtml() {
    var f = FOOTER, notes = '', qr = qrCode(f.qrLink || ('https://' + f.supportUrlShown)), q = qr.size + 8;
    for (var i = 0; i < (f.notes || []).length; i++) { notes += '<span>' + esc(f.notes[i]) + '</span>'; }
    function hour(cls, head, id) {
      return '<div class="hour ' + cls + '"><p class="eyebrow">' + esc(head) + '</p><div class="v" id="' + id + '"></div></div>';
    }
    return '<div class="progress"><i></i></div><div class="foot-main">' +
      '<div class="qr"><svg viewBox="-4 -4 ' + q + ' ' + q + '" role="img" aria-label="QR code for ' + esc(f.supportUrlShown) +
      '"><path d="' + qr.path + '"></path></svg></div>' +
      '<div class="foot-text"><div class="give"><div class="foot-top"><p class="eyebrow">' + esc(f.supportHeading) + '</p>' +
      '<div class="url">' + esc(f.supportUrlShown) + '</div></div><div class="ask">' + rich(f.supportAsk) + '</div>' +
      '<p>' + esc(f.supportText) + '</p></div>' +
      '<div class="hours">' + hour('', f.openTodayHeading, 'hours') + hour('', f.lastEntryHeading, 'last') + hour('now', f.timeNowHeading, 'clock') + '</div></div>' +
      '</div><div class="foot-strip">' + notes + '<div class="credit">' + esc(f.creditBy) +
      '<img alt="' + esc(f.creditName) + '" src="' + LOGOS.interpro + '"></div></div>';
  }
  var footHtml = '';
  function buildFooter() {
    var h = footerHtml();
    if (h === footHtml) { return; }
    footHtml = h;
    foot.innerHTML = h;
    bar = foot.querySelector('.progress i');
  }

  /* Opening hours for today, and the time now, both from the player's own clock.
     A date listed in specialDays wins; otherwise the season whose months include today. */
  function todaysHours(d) {
    var key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), m = d.getMonth() + 1, i;
    var special = HOURS.specialDays || [], seasons = HOURS.seasons || [];
    for (i = 0; i < special.length; i++) { if (special[i].date === key) { return special[i]; } }
    for (i = 0; i < seasons.length; i++) { if ((seasons[i].months || []).indexOf(m) > -1) { return seasons[i]; } }
    return seasons[0] || { open: '', lastEntry: '' };
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date(), set = todaysHours(d);
    var hr = d.getHours(), mn = d.getMinutes();
    document.getElementById('hours').textContent = set.open || '';
    document.getElementById('last').textContent = set.lastEntry || '';
    document.getElementById('clock').textContent = ((hr + 11) % 12 + 1) + ':' + pad(mn) + (hr < 12 ? 'am' : 'pm');
  }

  function build() {
    var list = [];
    for (var i = 0; i < SCREENS.length; i++) {
      var sc = SCREENS[i];
      var el = document.createElement('section');
      if (sc.type === 'feature') {
        el.className = 'screen feature t-ink ' + (sc.text === 'band' ? 'band' : 'at-' + (sc.text || 'top')) + (sc.wash ? ' wash' : '');
        el.innerHTML = buildFeature(sc);
      } else {
        el.className = 'screen list t-' + sc.theme + (sc.compact ? ' compact' : '') + (sc.airy ? ' airy' : '');
        el.innerHTML = buildList(sc);
      }
      var rises = el.querySelectorAll('.rise');
      var step = rises.length > 20 ? 28 : 70;
      for (var r = 0; r < rises.length; r++) { rises[r].style.animationDelay = (520 + r * step) + 'ms'; }
      deck.appendChild(el);
      list.push(el);
    }
    return list;
  }

  /* If a name is too long for its column (for example when a fallback font is in use), step that list's type down until it fits. */
  function fitNames() {
    var lists = deck.querySelectorAll('.names');
    for (var i = 0; i < lists.length; i++) {
      var list = lists[i], size = parseFloat(window.getComputedStyle(list).fontSize), guard = 0;
      while (guard++ < 14 && size > 26 && overflows(list)) { size -= 1; list.style.fontSize = size + 'px'; }
    }
  }
  function overflows(list) {
    var items = list.querySelectorAll('.n');
    for (var i = 0; i < items.length; i++) { if (items[i].scrollWidth > items[i].clientWidth + 1) { return true; } }
    return false;
  }

  /* Scale the 1080 x 1920 stage to the display. Add #cw or #ccw to the address if the
     player reports a landscape screen and the picture needs turning. */
  function layout() {
    var w = window.innerWidth, h = window.innerHeight;
    var turn = location.hash === '#cw' ? 90 : location.hash === '#ccw' ? -90 : 0;
    var s = turn ? Math.min(w / STAGE_H, h / STAGE_W) : Math.min(w / STAGE_W, h / STAGE_H);
    stage.style.transform = (turn ? 'rotate(' + turn + 'deg) ' : '') + 'scale(' + s + ')';
  }

  function schedule() {
    clearTimeout(timer);
    var secs = SCREENS[current].seconds || SETTINGS.defaultSeconds || 10;
    bar.className = '';
    void bar.offsetWidth;
    bar.style.animationDuration = secs + 's';
    bar.className = 'run';
    if (paused) { return; }
    timer = setTimeout(function () { go(current + 1); }, secs * 1000);
  }

  /* A new version of content.json waits here until the next page change. The new pages are
     built out of sight, then the screen slides from the old page straight onto the next new
     page, exactly like any other page change, so nobody watching can tell it happened. */
  var pending = null;
  function update(c) { pending = c; }

  function go(n, back) {
    if (busy) { return; }
    var old = null;
    if (pending) {
      use(pending); pending = null;
      old = els;
      els = build();
      fitNames();
      buildFooter();
      tick();
      n = back ? els.length - 1 : (current + 1) % els.length;
    } else if (els.length < 2) { return; }
    var next = (n + els.length) % els.length;
    if (!old && next === current) { return; }
    busy = true;
    var from = old ? old[current] : els[current], to = els[next];
    from.className = from.className.replace(/\s(is-on|is-in|rev)\b/g, '') + ' is-out' + (back ? ' rev' : '');
    to.className = to.className.replace(/\s(is-out|rev)\b/g, '') + ' is-on is-in' + (back ? ' rev' : '');
    current = next;
    setTimeout(function () {
      from.className = from.className.replace(/\s(is-out|rev)\b/g, '');
      if (old) { for (var i = 0; i < old.length; i++) { deck.removeChild(old[i]); } }
      busy = false;
    }, PUSH_MS);
    schedule();
  }

  els = build();
  buildFooter();
  tick();
  setInterval(tick, 10000);
  layout();
  els[0].className += ' is-on';
  fitNames();
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) { document.fonts.ready.then(fitNames); }
  schedule();

  window.addEventListener('resize', layout);
  window.addEventListener('hashchange', layout);

  /* For checking the screens at a desk: arrow keys or a click step through, space pauses. The wall screen needs none of this. */
  document.addEventListener('keydown', function (e) {
    var k = e.key || '';
    if (k === 'ArrowRight' || k === 'Right') { go(current + 1); }
    else if (k === 'ArrowLeft' || k === 'Left') { go(current - 1, true); }
    else if (k === ' ' || k === 'Spacebar') {
      paused = !paused;
      stage.className = paused ? 'paused' : '';
      if (!paused) { schedule(); } else { clearTimeout(timer); }
      e.preventDefault();
    }
  });
  viewport.addEventListener('click', function () { go(current + 1); });

  /* Ask the display to stay awake where the browser allows it */
  try {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      var keepAwake = function () { navigator.wakeLock.request('screen').catch(function () {}); };
      keepAwake();
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { keepAwake(); } });
    }
  } catch (err) {}

  window.maryRoseScreen = { go: go, update: update, count: function () { return els.length; }, pause: function () { paused = true; stage.className = 'paused'; clearTimeout(timer); } };
  return window.maryRoseScreen;
}

/* ==========================================================================
   LOADER. Reads content.json, keeps a copy of the last good version in case a
   later upload has a mistake in it, and checks its version number every few
   minutes, bringing a new version in without reloading the page.
   ========================================================================== */
function qrCode(link) {
  var q = qrcode(0, 'M'); q.addData(link); q.make();
  var n = q.getModuleCount(), p = '';
  for (var y = 0; y < n; y++) { for (var x = 0; x < n; x++) { if (q.isDark(y, x)) { p += 'M' + x + ' ' + y + 'h1v1h-1z'; } } }
  return { size: n, path: p };
}

function fetchText(url, done) {
  var x = new XMLHttpRequest();
  x.open('GET', url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + new Date().getTime(), true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4) { return; }
    if (x.status >= 200 && x.status < 300) { done(null, x.responseText); }
    else { done(new Error('could not load ' + url + ' (status ' + x.status + ')')); }
  };
  x.send();
}

function parseContent(text) {
  var c = JSON.parse(text);
  if (!c || !c.screens || !c.screens.length) { throw new Error('there are no screens listed'); }
  if (!c.footer) { throw new Error('the footer section is missing'); }
  return c;
}

function showProblem(msg, fatal) {
  var box = document.createElement('div');
  box.className = 'content-problem' + (fatal ? ' fatal' : '');
  box.textContent = 'content.json has a problem: ' + msg + (fatal ? '' : '. The screen is showing the last version that worked.');
  document.body.appendChild(box);
}

/* Load every picture a version uses, so nothing appears half-drawn when it goes on screen */
function preload(c, done) {
  var urls = [], k, left, finished = false;
  for (k in (c.images || {})) { urls.push(c.images[k]); }
  for (k in (c.logos || {})) { urls.push(c.logos[k]); }
  left = urls.length;
  function one() { if (--left <= 0 && !finished) { finished = true; done(); } }
  if (!left) { return done(); }
  setTimeout(function () { if (!finished) { finished = true; done(); } }, 60000);
  for (var i = 0; i < urls.length; i++) {
    (function (img, url) {
      img.onload = function () {
        if (img.decode) { img.decode().then(one, one); } else { one(); }
      };
      img.onerror = one;
      img.src = url;
    })(new Image(), urls[i]);
  }
}

function versionOf(c) { return c && c.version !== undefined ? String(c.version) : ''; }

(function () {
  var checking = /[?&]check\b/.test(location.search);
  function store(text) { try { window.localStorage.setItem(CACHE_KEY, text); } catch (e) {} }
  function cached() { try { return window.localStorage.getItem(CACHE_KEY); } catch (e) { return null; } }

  fetchText(CONTENT_URL, function (err, text) {
    var content = null, problem = err;
    if (!err) { try { content = parseContent(text); store(text); } catch (e) { problem = e; } }
    if (!content) {
      var old = cached();
      if (old) { try { content = parseContent(old); } catch (e) { content = null; } }
      if (window.console) { console.error('content.json:', problem && problem.message); }
      if (!content) { showProblem(problem.message, true); return; }
      if (checking) { showProblem(problem.message, false); }
    }
    var screen = startScreen(content);
    var showing = versionOf(content), loading = '';

    /* Every few minutes, read the version number in content.json. The same number: do nothing.
       A different number: load its pictures, then swap it in at the next page change. */
    var mins = (content.settings && content.settings.checkForUpdatesMinutes) || 5;
    setInterval(function () {
      fetchText(CONTENT_URL, function (e2, fresh) {
        if (e2) { return; }
        var c;
        try { c = parseContent(fresh); } catch (bad) { if (window.console) { console.error('content.json:', bad.message); } return; }
        var v = versionOf(c);
        if (v === showing || v === loading) { return; }
        loading = v;
        preload(c, function () {
          if (loading !== v) { return; }
          showing = v; loading = '';
          store(fresh);
          screen.update(c);
        });
      });
    }, mins * 60000);
  });
})();
</script>
</body>
</html>
